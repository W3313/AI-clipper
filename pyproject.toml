[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiclipper"
version = "0.1.0"
description = "Clean-room short-form video engine: auto-clipping, AI story videos, fake-text and Reddit templates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.2",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
ingest = ["yt-dlp>=2024.1"]
vision = ["opencv-python-headless>=4.9"]
llm = ["anthropic>=1.0", "pydantic>=2.6"]
tts = ["edge-tts>=6.1"]
overlays = ["playwright>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = [
  "faster-whisper>=1.0", "yt-dlp>=2024.1", "opencv-python-headless>=4.9",
  "anthropic>=1.0", "pydantic>=2.6", "edge-tts>=6.1", "playwright>=1.40",
]

[project.scripts]
aiclip = "aiclipper.cli:main"

[tool.setuptools.packages.find]
include = ["aiclipper*"]

[tool.setuptools.package-data]
aiclipper = ["templates/*.html", "templates/*.css", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
