<!-- aiclipper forum story card template, driven from Python via window.__forumRender. -->
<!--STYLE-->
<div id="stage">
  <div id="card">
    <div id="meta">
      <div id="badge"></div>
      <div>
        <div id="community"></div>
        <div id="byline"></div>
      </div>
    </div>
    <div id="title"></div>
    <div id="body"></div>
    <div id="row">
      <div class="chip"><span class="mark score"><i></i><i></i><i></i></span><span id="votes"></span></div>
      <div class="chip"><span class="mark replies"><i></i><i></i></span><span id="comments"></span></div>
    </div>
  </div>
</div>
<script>
  (function () {
    function trim(text, limit) {
      var value = String(text || "").trim();
      if (value.length <= limit) { return value; }
      return value.slice(0, limit).replace(/[\s.,;:]+$/, "") + "…";
    }

    function applyTheme(vars) {
      // The theme lives in aiclipper.overlays.THEMES; Python resolves it against
      // this canvas and hands us the finished pixel values, so the browser and
      // the Pillow backend cannot drift apart.
      var root = document.documentElement.style;
      Object.keys(vars || {}).forEach(function (name) {
        root.setProperty(name, String(vars[name]));
      });
    }

    window.__forumRender = function (data) {
      data = data || {};
      applyTheme(data.vars);
      document.body.setAttribute("data-theme", data.theme || "dark");
      document.getElementById("badge").textContent = data.badge || "";
      // Python has already stripped any borrowed site prefix and built the
      // byline -- the card's own labelling, not another forum's handle grammar.
      document.getElementById("community").textContent = data.community || "";
      var byline = document.getElementById("byline");
      byline.textContent = data.byline || "";
      byline.className = data.byline ? "" : "empty";
      document.getElementById("title").textContent = data.title || "";
      var body = document.getElementById("body");
      var excerpt = trim(data.body, 320);
      body.textContent = excerpt;
      body.className = excerpt ? "" : "empty";
      document.getElementById("votes").textContent = data.upvotes || "0";
      document.getElementById("comments").textContent = data.comments || "0";
      return document.getElementById("card").getBoundingClientRect().height;
    };
  })();
</script>
